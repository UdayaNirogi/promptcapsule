[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcapsule"
version = "0.1.2"
description = "Lossless prompt capsules for sharing and agent-to-agent handoff"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Udaya Nirogi", email = "udaya@example.com"}
]
keywords = ["prompt", "compression", "retrieval", "ai", "llm", "agents", "agent-to-agent", "integrity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "twine>=4.0",
]
vault = [
    "boto3>=1.26",
    "pygithub>=1.59",
]

[project.urls]
"Homepage" = "https://github.com/UdayaNirogi/promptcapsule"
"Bug Tracker" = "https://github.com/UdayaNirogi/promptcapsule/issues"

[tool.setuptools]
packages = ["promptcapsule"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=promptcapsule --cov-report=html --cov-report=term-missing"
