[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcapsule"
version = "0.3.2"
description = "Pass the prompt, not the payload. Lossless prompt capsules with fail-closed integrity for agent-to-agent handoff."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Udaya Nirogi", email = "data.pycap@gmail.com"}
]
keywords = ["prompt", "llm", "ai-agents", "agent-to-agent", "multi-agent", "handoff", "capsule", "integrity", "hmac", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "twine>=4.0",
]
vault = [
    "boto3>=1.26",
    "pygithub>=1.59",
]

[project.urls]
Homepage = "https://github.com/UdayaNirogi/promptcapsule"
Documentation = "https://github.com/UdayaNirogi/promptcapsule#readme"
Source = "https://github.com/UdayaNirogi/promptcapsule"
Changelog = "https://github.com/UdayaNirogi/promptcapsule/blob/main/CHANGELOG.md"
Specification = "https://github.com/UdayaNirogi/promptcapsule/blob/main/SPEC.md"
Issues = "https://github.com/UdayaNirogi/promptcapsule/issues"
Discussions = "https://github.com/UdayaNirogi/promptcapsule/discussions"

[project.scripts]
promptcapsule = "promptcapsule.cli:main"

[tool.setuptools]
packages = ["promptcapsule"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
