name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run core tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Run security regression tests
      run: |
        pytest tests/test_security.py -v --tb=short
      
    - name: Check test coverage
      run: |
        pytest tests/ --cov=promptcapsule --cov-report=term --cov-report=html
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r promptcapsule/ -f json -o bandit-report.json || true
        bandit -r promptcapsule/ -ll
    
    - name: Check dependencies for vulnerabilities
      run: |
        pip install -e .
        # Use 'safety scan' (modern command; 'check' is deprecated as of June 2024)
        # May skip if no runtime dependencies or API unavailable
        safety scan --output text || echo "Safety scan skipped (no runtime dependencies or API unavailable)"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install ruff black isort mypy
    
    - name: Run ruff
      run: |
        ruff check promptcapsule/ tests/
    
    - name: Check formatting with black
      run: |
        black --check promptcapsule/ tests/
    
    - name: Check import sorting
      run: |
        isort --check-only promptcapsule/ tests/
    
    - name: Type checking with mypy
      run: |
        mypy promptcapsule/ --ignore-missing-imports || true

  build:
    runs-on: ubuntu-latest
    needs: [test, security-audit, lint]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build package
      run: |
        pip install build
        python -m build
    
    - name: Check package metadata
      run: |
        pip install twine
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-packages
        path: dist/
